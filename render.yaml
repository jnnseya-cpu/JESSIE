# Push-button deployment of the API on Render (render.com).
#
# Why this file exists: deploying the backend should not require installing
# a CLI. Render reads this blueprint straight from the repository —
# dashboard → New → Blueprint → pick this repo → it builds Dockerfile.backend
# and gives you a public https URL.
#
# Secrets are declared with `sync: false`, which means Render asks for each
# value in the dashboard at deploy time. They are never written in this file.
#
# This deploys ONLY the API. The website stays on Vercel.

services:
  - type: web
    name: jessmove-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter
    region: frankfurt # closest Render region to the UK
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
      # The exact site origin. Both apex and www, until the redirect is canonical.
      - key: CORS_ORIGINS
        value: https://jessmove.com,https://www.jessmove.com
      # ---- filled in on the Render dashboard, never stored here ----
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PREMIUM_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PREMIUM_ANNUAL
        sync: false
      - key: STRIPE_PRICE_FAMILY_MONTHLY
        sync: false
      - key: STRIPE_PRICE_FAMILY_ANNUAL
        sync: false
      - key: STRIPE_PRICE_ORG_SEAT
        sync: false
