name: Post-deploy

# Asks the live API whether it is actually serving, every time a deployment
# succeeds.
#
# This exists because "deployed" and "serving" turned out to be different
# things for sixty days. Between 19 August and 18 October 2026 the site
# deployed successfully on every push while the API had not deployed at all,
# and nothing anywhere said so: CI proved the code, Vercel proved the build,
# and nobody asked the running system a single question. The gap was found by
# a person noticing the product had not changed.
#
# `deployment_status` fires when Vercel reports an outcome, and a GitHub
# runner can reach api.jessmove.com, which the development container cannot.
# So this is the one place in the repository where a claim about production
# can actually be checked.

on:
  deployment_status:

# `statuses: write` so the outcome can be posted as a commit status. The
# job summary is served from a host the GitHub API will not redirect to,
# so a summary is readable in a browser and nowhere else — which made
# "which capability is off" a question only a person could answer.
permissions:
  contents: read
  statuses: write

jobs:
  verify:
    # Only successful backend deployments. A failed one has nothing to ask,
    # and the site's deployments are a different question.
    if: >
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.environment, 'backend')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Is the live API serving this commit?
        id: verify
        continue-on-error: true
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        run: |
          # Truncated in the shell rather than with `git rev-parse`: on this
          # event the checkout is not guaranteed to contain the deployed
          # commit, and a verifier that falls over on its own expectation is
          # no use. /api/health publishes the first seven characters, so
          # compare like with like.
          #
          # A mismatch means the domain is not aliased to the project that
          # just deployed — invisible in the deployment record, and
          # indistinguishable from "my changes did nothing".
          bash scripts/verify-live.sh \
            https://api.jessmove.com/api \
            "${DEPLOYED_SHA:0:7}" \
            | tee /tmp/verify.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Named steps rather than only a job summary, because the summary is
      # served from a host the GitHub API will not redirect to — so the
      # outcome was readable in a browser and nowhere else. A step name is
      # in `/actions/runs/<id>/jobs`, which means the result can be read
      # without opening one.
      - name: Serving, everything configured
        if: steps.verify.outputs.code == '0'
        run: echo "verify-live reported 0"

      - name: Serving, but something is switched off
        if: steps.verify.outputs.code == '2'
        run: |
          echo "verify-live reported 2 — a capability is off; the summary names the variable"

      - name: Not serving correctly
        if: steps.verify.outputs.code != '0' && steps.verify.outputs.code != '2'
        run: |
          echo "verify-live reported ${{ steps.verify.outputs.code }}"

      # The one line worth reading, somewhere a tool can read it.
      # `gh api repos/{owner}/{repo}/commits/<sha>/statuses` returns the
      # description, so "which capability is off" is answerable without
      # opening the run.
      - name: Publish the result as a commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
          CODE: ${{ steps.verify.outputs.code }}
        run: |
          export LINE
          LINE=$(grep -m1 '^RESULT ' /tmp/verify.txt 2>/dev/null || echo 'RESULT unavailable')
          export STATE
          case "$CODE" in
            # A capability being off means serving-with-gaps, not a broken
            # deployment, so it must not mark the commit red.
            0|2) STATE=success ;;
            *)   STATE=failure ;;
          esac
          # 140 characters is the API's limit for a status description.
          # One line of Python: a block scalar cannot carry a script whose
          # own lines start at column 1 without breaking the YAML, which
          # is how the first version of this step was invalid.
          python3 -c "import json,os;print(json.dumps({'state':os.environ['STATE'],'context':'live-api','description':os.environ['LINE'][:139]}))" > /tmp/status.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$DEPLOYED_SHA" \
            -d @/tmp/status.json >/dev/null
        shell: bash

      - name: Say what it found
        run: |
          code='${{ steps.verify.outputs.code }}'
          {
            echo '### Live API after deploying `${{ github.event.deployment.sha }}`'
            echo
            echo '```'
            cat /tmp/verify.txt 2>/dev/null || echo '(the check produced no output)'
            echo '```'
            echo
            case "$code" in
              0) echo 'Serving, and everything is configured.' ;;
              2) echo 'Serving. Some capabilities are switched off — each line above names the variable that enables it. `AUTH_SECRET` is the one worth checking first: without it the API answers normally and registration and login are unavailable, which from outside is indistinguishable from nobody signing up.' ;;
              *) echo 'Not serving correctly. The deployment succeeded, so this is about the domain, the environment variables or the database rather than the build.' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

          # Exit 2 is "serving but incomplete" — a human should look, and it
          # is not a reason to mark a good deployment broken. Anything else
          # non-zero is a real failure.
          [ "$code" = "0" ] || [ "$code" = "2" ]
